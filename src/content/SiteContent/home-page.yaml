title: Homepage
description:
  This page introduces the AWS Distro for OpenTelemetry and how it fits with OpenTelemetry support in Amazon CloudWatch.
path: /

infoSection:
  heading: Introduction
  introduction:
    AWS Distro for OpenTelemetry (ADOT) is an AWS-supported distribution of the OpenTelemetry project, including
    language SDKs with auto-instrumentation and a collector. Use ADOT to send telemetry to AWS services such as
    Amazon CloudWatch and Amazon Managed Service for Prometheus, and to other OpenTelemetry-compatible
    observability solutions.
  callout:
    To send OpenTelemetry data to Amazon CloudWatch, AWS now recommends the CloudWatch agent or any
    OpenTelemetry Collector exporting to the CloudWatch OTLP endpoints. CloudWatch Application Signals provides the
    application performance monitoring (APM) experience. ADOT SDKs and auto-instrumentation remain supported.
  learnMoreText: OpenTelemetry in CloudWatch
  learnMoreLink: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OpenTelemetry-Sections.html
