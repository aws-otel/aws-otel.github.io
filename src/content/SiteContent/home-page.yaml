title: Homepage
description:
  This page introduces the AWS Distro for OpenTelemetry and how it fits with OpenTelemetry support in Amazon CloudWatch.
path: /

infoSection:
  heading: Introduction
  introduction:
    AWS Distro for OpenTelemetry (ADOT) is an AWS-supported distribution of the OpenTelemetry project, including
    language SDKs with auto-instrumentation and a collector. Use the ADOT SDKs to instrument your applications and send
    traces, metrics, and logs to Amazon CloudWatch through its OpenTelemetry (OTLP) endpoints, and use CloudWatch
    Application Signals for application performance monitoring.
  learnMoreText: OpenTelemetry in CloudWatch
  learnMoreLink: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OpenTelemetry-Sections.html

getInvolvedSection:
  heading: Get Involved
  subtitle:
    AWS Distro for OpenTelemetry is committed to being an open, collaborative, community-driven project.
    Join the community to participate and contribute.
